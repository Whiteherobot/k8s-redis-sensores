apiVersion: apps/v1
kind: Deployment
metadata:
  name: panel
  namespace: logistica-system
  labels:
    app: panel
spec:
  replicas: 2
  selector:
    matchLabels:
      app: panel
  template:
    metadata:
      labels:
        app: panel
    spec:
      containers:
        - name: panel
          image: logistica/panel:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: redis-password
          # Sin Redis el panel sigue vivo (muestra el aviso) pero no recibe tráfico.
          readinessProbe:
            httpGet: { path: /salud, port: http }
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: panel-service
  namespace: logistica-system
spec:
  type: NodePort
  selector:
    app: panel
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30081
