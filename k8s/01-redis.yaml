# La clave está en el Secret "redis-credentials", que crea scripts/desplegar.sh
# con una contraseña aleatoria (no se versiona).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc
  namespace: logistica-system
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: logistica-system
data:
  redis.conf: |
    appendonly yes
    appendfsync everysec
    dir /data
    port 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: logistica-system
  labels:
    app: redis
spec:
  replicas: 1
  # El volumen es ReadWriteOnce: con RollingUpdate el pod nuevo esperaría el
  # disco que todavía tiene el viejo. Recreate apaga primero y después levanta.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          command: ["sh", "-c", 'exec redis-server /etc/redis/redis.conf --requirepass "$REDIS_PASSWORD"']
          ports:
            - name: redis
              containerPort: 6379
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: redis-password
          # redis-cli sale con 0 aunque responda NOAUTH: hay que mirar que diga PONG.
          readinessProbe:
            exec:
              command: ["sh", "-c", 'redis-cli --no-auth-warning -a "$REDIS_PASSWORD" ping | grep -q PONG']
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", 'redis-cli --no-auth-warning -a "$REDIS_PASSWORD" ping | grep -q PONG']
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: datos
              mountPath: /data
            - name: config
              mountPath: /etc/redis
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
      volumes:
        - name: datos
          persistentVolumeClaim:
            claimName: redis-pvc
        - name: config
          configMap:
            name: redis-config
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: logistica-system
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
